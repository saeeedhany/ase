name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-headless:
    name: core (headless, ${{ matrix.os }})
    strategy:
      # One platform's failure used to cancel the others, so a Windows
      # configure error hid whether Linux and macOS were even passing.
      # See docs/adr/0130.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DASE_BUILD_GUI=OFF -DASE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        # Timed, because a Windows failure used to block on a dialog box
        # rather than fail — see docs/adr/0143.
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120

  # Windows builds the core and then three suites segfault — config
  # inside ase_config_create_default(), theme while reading a static
  # table it has just been handed a valid pointer into, plugin_host
  # right after registering a command. Three unrelated-looking sites,
  # no debugger to hand, and no reproduction on Linux or macOS.
  #
  # Kept running and kept non-blocking, deliberately. Deleting it would
  # throw away the only signal anyone has about Windows; gating on it
  # would block work on the platform this editor actually ships for.
  # README says plainly that Windows is unverified, and ROADMAP tracks
  # this. See docs/adr/0130.
  core-windows:
    name: core (headless, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DASE_BUILD_GUI=OFF -DASE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        # Timed, because a Windows failure used to block on a dialog box
        # rather than fail — see docs/adr/0143.
        run: ctest --test-dir build --output-on-failure -C Debug --timeout 120

  core-sanitizers:
    name: core (ASan/UBSan, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DASE_BUILD_GUI=OFF -DASE_BUILD_TESTS=ON -DASE_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The GUI, built against the OLDEST Qt this project ships against.
  #
  # ubuntu-22.04 is not an arbitrary runner choice: it is the AppImage's
  # own build base (packaging/README.md, docs/adr/0045), and it ships
  # Qt 6.2 — the floor gui/CMakeLists.txt asks for. debian:bookworm's
  # 6.4 sits between that and whatever a dev machine has.
  #
  # This job exists because of a specific failure: a Qt 6.6-only call
  # (QList::assign) reached main and stayed there through several
  # rounds of work with BOTH packages unbuildable, because every build
  # in between was native on a rolling-release machine with Qt 6.10 and
  # nothing ever compiled the GUI anywhere else. It was found by a human
  # cutting a release. See the addendum to docs/adr/0045.
  gui-qt-floor:
    name: gui (Qt 6.2 floor, ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6
        run: |
          sudo apt-get update -qq
          # libgl-dev matters even though nothing here uses OpenGL
          # directly: some of Qt6's own CMake package-config files
          # transitively require finding it, and without it
          # find_package(Qt6 COMPONENTS Widgets) fails outright.
          # build-essential is already on the runner image; naming it
          # anyway keeps this job runnable in a bare ubuntu:22.04
          # container, which is how it gets tested before it is trusted.
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake qt6-base-dev libgl-dev
      - name: Configure
        run: cmake -B build -DASE_BUILD_GUI=ON -DASE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Linking proves the API exists; it does not prove the app starts.
      # A missing plugin, a bad resource path or a constructor that
      # throws all link perfectly and then die on launch — so actually
      # launch it, headless, and require that it is still alive when the
      # timeout fires.
      - name: Smoke test (headless launch)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          printf 'int main(void) { return 0; }\n' > smoke.c
          set +e
          timeout --signal=TERM 15 ./build/gui/ase_gui smoke.c
          status=$?
          set -e
          # 124: timeout had to kill it, i.e. it was still running.
          # 143: it took the SIGTERM and exited cleanly.
          if [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            echo "ase_gui exited on its own with status $status — it should still have been running"
            exit 1
          fi
          echo "ase_gui stayed up"

      # docs/reference/ is written by the binary from the live command,
      # keybinding and config tables. Committing it means the docs site
      # builds without Qt; regenerating it here and requiring no diff is
      # what stops the committed copy drifting from the tables. See
      # docs/adr/0126.
      - name: Reference docs match the source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/gui/ase_gui --dump-docs docs/reference
          if ! git diff --exit-code --stat -- docs/reference; then
            echo
            echo "docs/reference/ is out of date. Regenerate it with:"
            echo "    ./build/gui/ase_gui --dump-docs docs/reference"
            exit 1
          fi
          echo "reference docs are current"

  # The GUI is 10,600 of the project's 14,200 lines and had no sanitizer
  # coverage at all until ADR 0107 wired it up — where it immediately
  # caught a null dereference in the change being made. Wiring it and
  # then not running it in CI leaves that to whoever remembers.
  gui-sanitizers:
    name: gui (ASan/UBSan, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake qt6-base-dev libgl-dev
      - name: Configure
        run: cmake -B build -DASE_BUILD_GUI=ON -DASE_BUILD_TESTS=ON -DASE_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
